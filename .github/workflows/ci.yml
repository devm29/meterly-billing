name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meterly
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: meterly_test
        ports: ["5507:5432"]
        options: >-
          --health-cmd "pg_isready -U meterly" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6407:6379"]
    env:
      METERLY_TEST_DATABASE_URL: postgresql+asyncpg://meterly@localhost:5507/meterly_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  contract:
    # Parses live API responses with the console's Zod schemas to catch drift.
    runs-on: ubuntu-latest
    needs: [backend, web]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meterly
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: meterly
        ports: ["5507:5432"]
        options: >-
          --health-cmd "pg_isready -U meterly" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6407:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - working-directory: backend
        run: |
          pip install -e ".[dev]"
          alembic upgrade head
          python scripts/seed.py
          uvicorn meterly.api.app:create_app --factory --port 8107 &
          for _ in $(seq 30); do curl -sf localhost:8107/healthz && break; sleep 1; done
      - working-directory: web
        run: pnpm install --frozen-lockfile && pnpm vitest run src/lib/api/__tests__/contract.test.ts
        env:
          METERLY_CONTRACT_API_URL: http://localhost:8107
